name: Submission Check

on:
  issues:
    types: [opened, edited, reopened]

permissions: {}

jobs:
  check:
    if: contains(github.event.issue.labels.*.name, 'mod-submission') || contains(github.event.issue.labels.*.name, 'mod-update')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Parse submission and evaluate safety
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            console.log('Evaluating issue #' + issue.number + ': ' + issue.title);

            // Basic issue validation
            const hasRepo = /https:\/\/github\.com\/[^\s/]+\/[^\s/]+/.test(body);
            if (!hasRepo) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '❌ **自动检查未通过**：未在投稿描述中检测到有效的 GitHub 源码仓库链接。请编辑 Issue 提供开源仓库地址。'
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['needs-changes']
              });
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: '✅ **自动检查完成**：格式与源码地址已记录。维护者审查确认后将发送 `/sign <commit>` 指令执行 Ed25519 签名与上架。'
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['awaiting-review']
            });
